
services:
  gamereservewebapi:
    image: gamereservewebapi
    build:
      context: .
      dockerfile: src/GameReserve.WebApi/Dockerfile
    ports:
      - "5110:5110"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "5110"
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=gamereserve_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};
      ConnectionStrings__Redis: ${REDIS_PORT}
      Stripe__ApiKey: ${STRIPE_APIKEY:-}
      Stripe__Webhook: ${WEBHOOK_KEY:-}
      RabbitMq__Host: "rabbitmq"
      Admin__FullName: "Admin"
      Admin__Email: ${ADMIN_EMAIL:-admin@gamereserve.com}
      Admin__Password: ${ADMIN_PASSWORD:-Admin123!}
      Jwt__SecretKey: ${JWT_SECRET:-replace_with_a_secure_secret_at_least_32_bytes_long}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:latest
    container_name: game-reserve-postgres
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      - POSTGRES_DB=gamereserve_db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gamereserve_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  redis:
    image: redis:alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
