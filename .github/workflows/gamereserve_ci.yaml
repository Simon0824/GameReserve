name: GameReserve CI
on: 
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DOTNET_VERSION: "10.x"
  SOLUTION_PATH: "GameReserve.slnx"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-restore --no-build --verbosity normal
  
  docker-test:
    name: Docker smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Download core
        uses: actions/checkout@v4

      - name: Create dev .env
        run: cp .env.example .env
      
      - name: Validate compose file
        run: docker compose config -q

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/GameReserve.WebApi/Dockerfile
          load: true
          tags: gamereservewebapi
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Run full app
        run: docker compose up -d --no-build
      
      - name: Wait for API
        run: |
          timeout 90 bash -c 'until curl -fsS http://127.0.0.1:5110/swagger/index.html >/dev/null; do sleep 2; done'

      - name: Smoke test endpoints
        run: |
          set -euo pipefail

          curl -fsS -X POST http://localhost:5110/api/Identity \
           -H 'Content-Type: application/json' \
           -d '{  
            "fullName": "string",
            "email": "string@smoketest.com",
            "password": "String123!"
          }'

          TOKEN=$(curl -fsS -X POST http://localhost:5110/api/Identity/auth/login \
           -H 'Content-Type: application/json' \
           -d '{  
            "email": "string@smoketest.com",
            "password": "String123!"
          }' | jq -er '.token | strings | select(length > 0)')

          curl -fsS http://localhost:5110/api/Games \
          -H "Authorization: Bearer $TOKEN"

      - name: Show logs if failure
        if: failure()
        run: docker compose logs --no-color

      - name: Clean
        if: always()
        run: docker compose down -v